[project]
name = "refute"
version = "0.1.0"
description = "Find signals. Try to kill them. Keep what survives."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Klauber Lucilla" }]
keywords = ["falsification", "reproducibility", "exoplanets", "TESS", "pre-registration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "astropy>=6.1",
  "lightkurve>=2.5",
  "astroquery>=0.4.7",
  "matplotlib>=3.8",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.scripts]
refute = "refute.cli:main"

[project.entry-points."refute.packs"]
tess = "refute.packs.tess:PACK"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-socket>=0.7",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refute"]

[tool.uv]
# Supply-chain cooldown: `uv lock` only considers releases uploaded at least 7 days
# before the moment it resolves. Recorded in uv.lock as exclude-newer-span = "P7D".
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -q"
filterwarnings = ["ignore::DeprecationWarning:lightkurve.*"]
