[project]
name = "refute"
version = "0.2.0"
description = "Find signals. Try to kill them. Keep what survives."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Klauber Lucilla" }]
keywords = ["falsification", "reproducibility", "exoplanets", "TESS", "pre-registration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "astropy>=6.1",
  "lightkurve>=2.5",
  "astroquery>=0.4.7",
  "matplotlib>=3.8",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.scripts]
refute = "refute.cli:main"

[project.entry-points."refute.packs"]
tess = "refute.packs.tess:PACK"

[dependency-groups]
# py-ecc verifies the drand signature in the v0.2 target selection (calibration/v0.2/);
# added after the WP0 freeze as a documented exception (calibration/v0.2/PROTOCOL.md).
# pyarrow reads the Parquet frame of the v0.3 selection (decision D-18; WP0 table of
# docs/validation/v0.3/wp0-acceptance.md), resolved under the 7-day cooldown.
calibration = [
  "py-ecc>=8.0.0,<9",
  "pyarrow>=25.0.1,<26",
]
dev = [
  "pytest>=8.0",
  "pytest-socket>=0.7",
  "pytest-timeout>=2.4.0,<3",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refute"]

[tool.uv]
# The uv version, the same locally and in CI (setup-uv's `version` input in ci.yml): any
# other uv refuses to run on this project (issue #59; wp0-acceptance.md section 3.5).
required-version = "==0.12.24"
# The calibration group is installed by default, so the drand verification used by
# the v0.2 selection runs (and is tested) everywhere, including CI.
default-groups = ["dev", "calibration"]
# Supply-chain cooldown: `uv lock` only considers releases uploaded at least 7 days
# before the moment it resolves. Recorded in uv.lock as exclude-newer-span = "P7D".
exclude-newer = "7 days"
# Interpreters come only from uv-managed builds, at the exact versions of .python-version
# and of the CI matrix (WP0, docs/validation/v0.3/wp0-acceptance.md sections 3.4-3.5).
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -q"
filterwarnings = ["ignore::DeprecationWarning:lightkurve.*"]
# pytest-timeout: a test item (setup, call and teardown) that runs longer than this is a
# hang, not a slow test. The largest item measured was 764 s (the module fixture of
# tests/test_ebcatalog_own_tic_e2e.py, ubuntu-24.04, Python 3.12, main run 39033821323 of
# 2026-10-17), so 1800 s leaves a margin of about 2.4 times. The method is the plugin's
# default: "signal" where available (Linux: the test fails and the run goes on, the JUnit
# file is written), "thread" on Windows (the stacks are printed and the whole process
# ends, with no JUnit file; tests/conftest.py records the test that was running, and
# scripts/junit_counts.py reports the run as incomplete).
timeout = 1800
