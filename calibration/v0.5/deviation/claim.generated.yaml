schema_version: 1
id: tess-calibration-v0.5-c3
kind: discover
pack: tess
title: 'Refute v0.5 calibration, C3: newly drawn real controls, the v0.5 battery'
hypothesis: Each control of calibration/v0.5/selection/targets.yaml (8 confirmed planets
  and 8 eclipsing-binary false positives, newly drawn; their reserves) is attacked
  by the declared decisive v0.5 battery; each case ends in SURVIVED, WEAKENED, REFUTED
  or INCONCLUSIVE. A feasibility sample, not a class-wise validation; method not validated.
created: '2026-11-04'
authors:
- Klauber Lucilla
definitions:
  protocol: refute-tess-v0.5-calibration, calibration/v0.5/PROTOCOL.md (sections 5
    and 6).
  signal_identity: The planet's found period within a relative tolerance of 0.001
    of the published period; the false positive's at one of the factors [1.0, 2.0,
    0.5]. Decided before any disposition is scored; a failure is replaced by the next
    reserve (section 6).
  verdict: Aggregated from the decisive tests only, with the severity each test emits
    (docs/verdicts.md). Never 'confirmed', 'discovery', 'TRUE' or a planet letter.
  method_status: not_validated
  max_sector: S_max = 107 (test_plan.discovery.max_sector).
