# Refute v0.4 pilot claim (calibration/v0.4/PROTOCOL.md, section 12, step 3).
# Written by calibration/v0.4/write_claim.py (refute.packs.tess.discover.claim) after
# the selection: the v0.2 thresholds on the legacy path with H4, H7 and H9a (every
# default of this commit written out). Locked with `refute lock` from a clean tree.
schema_version: 1
id: tess-discover-v0.4-pilot
kind: discover
pack: tess
title: 'Refute v0.4 pilot: a funnel search for transit signals, attacked before belief'
hypothesis: 'Among the 100 funnel stars selected by calibration/v0.4/PROTOCOL.md (the
  first N of them run, N from the rule of section 4.4), any transit-like signal Refute
  finds in SPOC 120-s light curves of sectors 1 to S_max is attacked by the declared
  decisive battery; each case ends in SURVIVED, WEAKENED, REFUTED or INCONCLUSIVE,
  with SURVIVED meaning only: the signal survived the declared decisive battery; temporal
  confirmation was not required; the method is not validated. The two known controls
  (a planet and a false positive) run first, with the same battery.'
created: '2026-10-30'
authors:
- Klauber Lucilla
definitions:
  protocol: refute-tess-discover-v0.4, calibration/v0.4/PROTOCOL.md; the selection
    of round 6598335 from the protocol commit 0000018f1f99d413a211d00f557bf5d60b01858b.
  run_set: 'The two controls, then the first N funnel stars in the walk order of selection/targets.yaml;
    the stars beyond N are ''not evaluated past stage 1: N rule'' (section 4.4).'
  signal_identity: 'Controls only (section 4.3): the planet''s found period is within
    a relative period_tolerance of 0.001 of the published period (aliases not counted);
    the false positive''s is within it at one of flag_signal_period_factors [1, 2,
    0.5]. The values are code (refute.packs.tess.discover.protocol.CONTROLS). The
    epoch difference is reported, not required.'
  verdict: Aggregated from the decisive tests only, with the severity each test emits
    (docs/verdicts.md); holdout_by_year is a diagnostic and never changes it. Never
    'confirmed', 'discovery', 'TRUE' or a planet letter.
  method_status: 'not_validated: nothing in v0.4 is a validated method (docs/validation/v0.2.1/closing-2026-10-27.md).'
  max_sector: 'S_max = 107: no product of a later sector is downloaded or read (test_plan.discovery.max_sector).'
data_sources:
