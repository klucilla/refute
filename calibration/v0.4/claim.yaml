  url: https://tess.mit.edu/public/target_lists/target_lists.html
  retrieved: '2026-10-29T21:21:03Z'
  notes: Assembled from attempt 4 (PROTOCOL.md 4.0, exception); times are estimates;
    every list's URL, size and SHA-256 in inputs.json.
- name: ExoFOP-TESS TOI table
  url: https://exofop.ipac.caltech.edu/tess/download_toi.php?sort=toi&output=csv
  retrieved: '2026-10-29T21:24:18Z'
  notes: Exclusions, deduplication and the false-positive pool; inputs.json.
- name: ExoFOP-TESS CTOI table
  url: https://exofop.ipac.caltech.edu/tess/download_ctoi.php?sort=ctoi&output=csv
  retrieved: '2026-10-29T21:24:21Z'
  notes: Exclusions and deduplication; inputs.json.
- name: NASA Exoplanet Archive, Planetary Systems Composite Parameters
  url: https://exoplanetarchive.ipac.caltech.edu/TAP/sync
  retrieved: '2026-10-29T21:24:34Z'
  notes: Exclusions, deduplication and the planet pool; inputs.json.
- name: TESS-EB, Prsa et al. 2022 (VizieR J/ApJS/258/16/tess-ebs)
  url: https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJS/258/16/tess-ebs&-out=TIC,m_TIC,RAJ2000,DEJ2000,Per&-out.max=unlimited
  retrieved: '2026-10-30T14:50:51Z'
  notes: 'The static edition obtained 2026-10-18 (content SHA-256 equal to the v0.2
    snapshot''s). Not redistributed (#33): eb_catalog.csv holds reference rows only,
    resolved at run time from a local copy checked against eb_catalog_scan.json.'
- name: Gaia DR3 eclipsing-binary candidates (the v0.2.0 release asset)
  url: https://github.com/klucilla/refute/releases/download/v0.2.0/gaia_dr3_vari_eclipsing_binary.csv
  retrieved: '2026-10-30T14:50:56Z'
  notes: Rows within 120 arcsec of the targets, in eb_catalog.csv; snapshot hash in
    eb_catalog_scan.json.
- name: 'MAST: TIC fields and SPOC 120-s light curve and pixel file listings'
  url: https://mast.stsci.edu
  retrieved: '2026-10-30'
  notes: Queried live during the selection walk; each answer and its time are in selection/selection.json.
    Data are downloaded at run time, with their hashes in every dossier.
