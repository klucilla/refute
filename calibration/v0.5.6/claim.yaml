# Refute v0.5.6 part B: agreement of the labelled v0.5 battery with TFOPWG dispositions.
# docs/plans/v0.5.6-plan-amendment-1.md (the maintainer's decisions of 2026-11-22, 13:00; #218).
# Written by calibration/v0.5.6/part_b_claim.py before the lock. The targets attachment is the
# pool; the drand round fixed in the definitions (about 30 minutes after the lock) orders it
# (part_b_draw.py); only the drawn TICs are run (part_b_run.py), and the claim's verdict comes only
# from part_b_evaluate.py.
schema_version: 1
id: tess-v0.5.6-part-b-fp-agreement
kind: discover
pack: tess
title: 'Refute v0.5.6 part B: agreement of the labelled v0.5 battery with TFOPWG dispositions (WEAKENED;
  does not meet D1, D2, D4, T2a)'
hypothesis: Among the TOIs of the frame's confirmation half, the v0.5 battery (limits label 'WEAKENED;
  does not meet D1, D2, D4, T2a') refutes, on the TOI's own signal, a larger share of the TOIs dispositioned
  FP by the TFOPWG than of the TOIs matched to TESS-discovered confirmed planets (Fisher exact, one-sided,
  alpha 0.05), while its rate on those planets stays at most 0.05 with an upper Wilson 95 % bound
  at most 0.10. It measures agreement with TFOPWG dispositions on photometry that overlaps theirs,
  never that the battery detects false positives. The hypothesis was suggested by part A's descriptive
  table (FP 0/2/5/14 of 21; planet arm 13/16/9/82 of 120) and was not a pre-written door.
created: '2026-11-22'
authors:
- Klauber Lucilla
definitions:
  protocol: docs/plans/v0.5.6-plan-amendment-1.md, section 4 (its SHA-256 in test_plan.discovery.inputs.amendment)
  strata: 'confirmation half of part-a-frame.csv: planet = the planet arm; fp = the open arm with
    tfopwg_disp_descriptive FP; TICs in part-b-exposure.json exposed_tics left out; FA, PC, APC, KP,
    CP and blank not drawn'
  draw: 150 eligible per stratum (at least 120), in the order of the drand round these definitions
    fix (part_b_draw.py)
  event: status OK, nonzero coverage, outcome REFUTED and identity matched (period factor 1 within
    0.001, epoch within half the TOI's duration)
  missing_data: ERROR counts as a non-event in the denominator and as a loss; MISSING_PRODUCTS, zero
    coverage and no record are losses outside the denominator; more than floor(0.10 x drawn) losses
    in a stratum make the claim INCONCLUSIVE
  verdict: INCONCLUSIVE if the draw is incomplete or the losses pass the cap; SURVIVED if p <= 0.05
    and the guard holds; WEAKENED if p <= 0.05 and the guard fails; REFUTED if p > 0.05 (part_b_evaluate.py).
    Never 'confirmed', 'discovery', 'TRUE' or a planet letter.
  known_defects: OverflowError in gaussian_sigma_from_chi2 via centroid_v5 (#59; such a target is
    ERROR); the half-period search defect (#59; not an event)
  method_status: not_validated
  limits_label: WEAKENED; does not meet D1, D2, D4, T2a
  max_sector: S_max = 107 (test_plan.discovery.max_sector).
  drand_network: drand mainnet, default chain (https://api.drand.sh); genesis 1595431050, period 30
    s (refute.drand)
  drand_chain_hash: 8990e7a9aaed2ffed73dbd7092123d6f289930540d7651336225dc172e51b2ce
  drand_round: 'unset: fixed just before the lock (part_b_claim.py --drand-round auto)'
  drand_round_time_utc: 'unset: fixed just before the lock (part_b_claim.py --drand-round auto)'
  drand_rule: the draw uses this round and no other; its BLS signature is verified, and its time must
    be after the lock commit's time on GitHub (the creation time of the lock commit's CI push run,
    read from GitHub); otherwise the execution stops without a draw and the maintainer decides (no
    relock)
