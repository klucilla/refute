targets:
- key: arXiv-2309.15704v2-C1
  type: value
  statement: In the interpolation setting of the UCI energy dataset, Anchored-Networks
    (an ensemble) detects out-of-distribution inputs with an AUROC of 98.7%.
  source:
    arxiv_id: '2309.15704'
    version: 2
    location: Table 2, block 'Interpolation', row 'energy', column 'Ensemble AN'
    quote: '98.7'
    retrieved_utc: '2026-10-19T01:53:17Z'
    repository_url: https://github.com/antoinedemathelin/maxwent-expe
    repository_commit: c67aa620a64e139d8599613e24cc57b34af5b67f
  inventory:
    candidate_id: T2/Interpolation/energy/Ensemble/AN
    position: 1
    transcription:
      command: '["python", "run.py", "--config", "configs/uci_all.yml"]'
      location: Table 2, block 'Interpolation', row 'energy', column 'Ensemble AN'
      metric: auroc
      split: interpolation
      value: '98.7'
  dataset: UCI energy (downloaded by uci_datasets.py from archive.ics.uci.edu, CC
    BY 4.0)
  metric:
    name: auroc
    split: interpolation
    unit: percent
    higher_is_better: true
    reported: 98.7
    reported_uncertainty:
      kind: none
    reported_n_seeds: 1
    n_examples: 423
  comparison_mode: two_sided
  scope: full_training
  run:
    argv:
    - python
    - run.py
    - --config
    - configs/uci_all.yml
    workdir: .
    seed_argument: null
    metric_extraction:
      from: file
      file: logs/results/uci/energy_interpol_AnchoredNetwork_0.csv
      csv:
        column: '0'
        row:
          column: ''
          equals: auc_ood
      unit: fraction
  seeds:
    base:
    - 0
    base_cap: 1
    base_source: documented
  attacks:
  - name: seeds
    applies: false
    reason: 'run.py takes no seed: the grid runs state 0 (n_runs 1 in configs/uci_all.yml)'
  - name: data_split
    applies: false
    reason: the split is uci_interpol's cut with the state of the run, with no argument
      of its own
  - name: ablation
    applies: false
    reason: the claim names no component to disable
  - name: holdout
    applies: false
    reason: the in-distribution and OOD sets are cut by the code, with no argument
  - name: leakage
    applies: false
    reason: the populations are cut from one file by the code; the claim's split is
      derived, with no train and test files to compare
  - name: trivial_baseline
    applies: false
    reason: the metric is an AUROC of OOD detection from predicted uncertainty, not
      a single-label classification
  metric_recompute:
    applies: false
    reason: the repository saves the scores of the run, not the per-example uncertainties
      auc_ood is computed from
  coverage_evidence:
    method:
      selected_evaluation:
        kind: final
      routes:
      - route: printed_count
        count:
          from: log
          regex:
            pattern: (?m)^ood examples scored=([0-9]+)$
            group: 1
        link:
        - file: utils.py
          lines:
          - 177
          - 234
          role: 'results_regression scores xtest and xood and prints no count of the
            examples it scores, so this declared route finds none: metric_extracted
            is then INCONCLUSIVE by coverage'
  approvals: &id001
    transcription:
      approved_by: maintainer
      approved_utc: '2026-10-18T16:52:05Z'
      approved_commit: efa9e4b11018ce3cad6e026dd4d4258e9bde7298
      inventory_sha256: 3f48f1003dbfd0991e802c20de0f9479b43e6484de3ca0db0efc0c3d40fd7cb7
    claim:
      approved_by: maintainer
      approved_utc: '2026-10-19T13:11:54Z'
