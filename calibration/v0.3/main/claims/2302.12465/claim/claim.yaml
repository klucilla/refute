    location: Table 4, row 'UserItemAttr', column 'PaGE-Link (ours)'
    quote: '0.954'
    retrieved_utc: '2026-10-19T01:38:45Z'
    repository_url: https://github.com/amazon-science/page-link-path-based-gnn-explanation
    repository_commit: cdb7160f9a2fd90bded8cefa8f591f9a0e47ee6c
  inventory:
    candidate_id: T4/UserItemAttr/PaGE-Link
    position: 1
    transcription:
      command: '["sh", "-c", "python pagelink.py --dataset_name=synthetic --config_path=config.yaml
        --save_explanation && python eval_explanations.py --dataset_name=synthetic
        --emb_dim=64 --hidden_dim=64 --out_dim=64 --eval_explainer_names=pagelink"]'
      location: Table 4, row 'UserItemAttr', column 'PaGE-Link (ours)'
      metric: auroc
      split: test_links
      value: '0.954'
  dataset: UserItemAttr (synthetic, datasets/synthetic)
  metric:
    name: auroc
    split: test_links
    unit: fraction
    higher_is_better: true
    n_examples: 129
    reported: 0.954
    reported_uncertainty:
      kind: none
  comparison_mode: two_sided
  scope: full_training
  weights: synthetic_model
  run:
    argv:
    - sh
    - -c
    - python pagelink.py --dataset_name=synthetic --config_path=config.yaml --save_explanation
      && python eval_explanations.py --dataset_name=synthetic --emb_dim=64 --hidden_dim=64
      --out_dim=64 --eval_explainer_names=pagelink
    workdir: .
    seed_argument: null
    metric_extraction:
      from: log
      regex:
        pattern: '(?m)^Average Mask-AUC: +(-?[0-9]+\.[0-9]+)$'
        group: 1
      unit: fraction
  seeds:
    base:
    - 0
    base_cap: 1
    base_source: documented
  attacks:
  - name: seeds
    applies: false
    reason: 'each script calls set_seed(0) with no argument: no seed can be changed
      without editing the code'
  - name: data_split
    applies: false
    reason: the split is eids_split with seed 0 fixed in the code, with no argument
  - name: ablation
    applies: false
    reason: the claim names no component to disable
  - name: holdout
    applies: false
    reason: the test links are fixed by the code's split, with no argument
  - name: leakage
    applies: false
    reason: the metric scores explanation masks against ground-truth paths on one
      graph; there are no train and test examples of the explainer to compare
  - name: trivial_baseline
    applies: false
    reason: the metric is a ROC-AUC of edge masks per pair, not a single-label classification
  metric_recompute:
    applies: false
    reason: the explainers save their masks as pickled tensors and no file holds the
      per-pair AUCs; the recomputer does not average an AUC per pair
  coverage_evidence:
    method:
      selected_evaluation:
        kind: final
      routes:
      - route: printed_count
        count:
          from: log
          regex:
            pattern: (?m)^refute-population-size pagelink ([0-9]+)$
            group: 1
        link:
        - file: eval_explanations.py
          lines:
          - 94
          - 109
          role: 'the test links kept when pred > 0.5, keyed by the pair as comp_graphs:
            the population'
        - file: eval_explanations.py
          lines:
          - 133
          - 139
          role: one mask AUC per pair of comp_graphs, appended to mask_auc_list
        - file: eval_explanations.py
          lines:
          - 141
          - 145
          role: the mean over mask_auc_list, printed; the allowed patch 2302-population-size.patch
            prints len(mask_auc_list) on the next line, named by the explainer
