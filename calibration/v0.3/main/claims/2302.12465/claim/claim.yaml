id: v0.3-main-2302.12465
kind: replicate
pack: ml
title: 'PaGE-Link: Path-based Graph Neural Network Explanation for Heterogeneous Link
  Prediction (arXiv 2302.12465v3), the three drawn claims'
hypothesis: The drawn claims of Table 4 (UserItemAttr) reproduce from the repository
  at the pinned commit, with its saved link predictor.
created: '2026-10-19'
authors:
- refute
definitions:
  scope: 'Every claim is full_training (plan section 5: full training, or evaluation
    of a released checkpoint): each run optimizes the explainer''s masks from the
    start (pagelink.py, baselines/gnnexplainer_link.py or baselines/pgexplainer_link.py)
    and eval_explanations.py scores those masks. The repository''s trained link predictor,
    saved_models/synthetic_model.pth of the pinned commit, is a pre-trained input
    loaded frozen, declared as weights that are a file of the repository; it is never
    trained by the run, and these claims do not test its training (wp3-repository-weights-acceptance.md,
    reviewed by Codex on 2026-10-19).'
  verdict_paths: 'No attack applies to these claims (the seed and the split are fixed
    in the code, with no argument), so the verdict of each claim rests on its base
    reproduction alone: when the base run completes it is REPRODUCED or NOT_REPRODUCED,
    never FRAGILE; NOT_REPRODUCIBLE or INCONCLUSIVE remain possible when the base
    reproduction cannot be obtained (the maintainer''s decision of 2026-10-19).'
  transcription_approval_time: approvals.transcription.approved_utc is 2026-10-18T16:52:05Z,
    the time of the maintainer's approval comment (https://github.com/klucilla/refute/issues/158#issuecomment-6252536898).
    The frozen inventory attached carries 2026-10-18T17:05:00Z, a value derived from
    the local time stated in the maintainer's message; the correction is recorded
    in https://github.com/klucilla/refute/issues/158#issuecomment-6252562691, and
    the inventory is not edited (the maintainer's decision of 2026-10-19).
  reference_pgexp_link: 'The comparison''s reference, PGExp-Link, runs errata 2''s
    command: errata 1''s with --train_pgexplainer added, the repository''s own training
    parameters, none tuned. Without that option baselines/pgexplainer_link.py never
    trains the PGExplainer''s mask generator (lines 55 and 117-125). This is a reproduction
    with an explicit correction of the documented procedure: neither the repository
    nor the paper shows that this command produced the published 0.578 (the maintainer''s
    decision of 2026-10-19; https://github.com/klucilla/refute/issues/158#issuecomment-6267417453).'
