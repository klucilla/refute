<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">How a transit shows up in a light curve</title>
  <desc id="desc">Top: a planet passes in front of its star at positions 1, 2 and 3. Bottom: the star's measured brightness over time is flat at 1 and 3 and dips at 2, while the planet blocks part of the star. The dip repeats one orbital period later. The depth is about the square of the planet-to-star radius ratio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#334155" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="host" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="hostGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="440" rx="18" fill="url(#bg)"/>
  <circle cx="330" cy="118" r="148" fill="url(#hostGlow)"/>
  <circle cx="330" cy="118" r="78" fill="url(#host)"/>
