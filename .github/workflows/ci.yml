name: CI

# The workflow is skipped when every changed file is documentation that no test,
# lint step or build reads. Not ignored, because they are read: README.md (the
# package metadata in pyproject.toml and tests/test_update_readme.py), LICENSE
# (license-files), everything under calibration/, and every .py, .json, .yaml or
# .csv file, including those under docs/ (ruff lints them). A change that mixes
# documentation with any other file still runs the workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
      - "docs/assets/*.svg"
      - "docs/assets/*.png"
      - "CLAUDE.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "PROMPT-v0.1.md"
      - "ROADMAP.md"
      - "SECURITY.md"
  # Same list as for push.
  pull_request:
    paths-ignore:
      - "docs/**/*.md"
      - "docs/assets/*.svg"
      - "docs/assets/*.png"
      - "CLAUDE.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "PROMPT-v0.1.md"
      - "ROADMAP.md"
      - "SECURITY.md"

permissions:
  contents: read

# A newer run on the same pull request branch cancels the one in progress. Runs on
# main are never cancelled; a push to main is tested unless every changed file is in
# the paths-ignore list above.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Runner OS labels are pinned (not `-latest`) so an image migration happens in
        # its own commit with its own green run. Pinning the OS label does not freeze
        # the image: its version is recorded by the "Record environment" step.
        os: [ubuntu-24.04, windows-2025]
        # Exact Python versions (major.minor.patch), from uv-managed builds only
        # (python-preference = "only-managed" in pyproject.toml), so the patch no longer
        # depends on what the runner image ships; the "Check interpreter" step enforces
        # both (docs/validation/v0.3/wp0-acceptance.md, sections 3.4 and 3.5).
        python: ["3.12.15", "3.13.16"]
        # The suite is split into shards that run in parallel (scripts/ci_shard.py):
        # every test still runs on every OS and Python above; tests/test_ci_shard.py
        # checks that each test file is in exactly one shard.
        shard: [heavy-a, heavy-b, rest]
    steps:
      # Actions are pinned to a commit; the tag is in the comment. setup-uv
      # publishes no major-version tags since v8, so `@v10` would not resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv is pinned, the same version locally and in CI, released at least 7 days
          # before it was chosen (CLAUDE.md; wp0-acceptance.md section 3.5).
          version: "0.12.24"
          python-version: ${{ matrix.python }}
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      # The effective environment of this run: runner image, uv, Python (version and
      # origin) and the installed dependencies (from the frozen uv.lock).
      - name: Record environment
        shell: bash
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          uv --version
          uv run python -VV
          uv python find "${{ matrix.python }}"
          uv python list --only-installed
          uv pip list --format=freeze
      # Fails the job unless the environment's interpreter has exactly the matrix
      # version and is a uv-managed build (under the job's uv Python install directory).
      - name: Check interpreter
        run: uv run python scripts/check_interpreter.py "${{ matrix.python }}"
      # calibration/*/audit/, docs/validation/v0.2.1/pre-document-runs/ and
      # docs/validation/v0.2.1/population/ hold records whose bytes are cited by SHA-256:
      # they are never linted or reformatted (see CLAUDE.md).
      - name: Lint
        run: uv run ruff check . --extend-exclude "calibration/*/audit" --extend-exclude "docs/validation/v0.2.1/pre-document-runs" --extend-exclude "docs/validation/v0.2.1/population"
      - name: Format
        run: uv run ruff format --check . --extend-exclude "calibration/*/audit" --extend-exclude "docs/validation/v0.2.1/pre-document-runs" --extend-exclude "docs/validation/v0.2.1/population"
      # The tests that spread work over processes use REFUTE_WORKERS when it is set
      # (src/refute/core/runner.py). In CI it is every core of the runner; locally the
      # default stays os.cpu_count() - 2. The number of workers should change only the
      # execution, preserving the scientific results (a worker-count equivalence test
      # is planned: docs/validation/v0.2.1/workers-equivalence-acceptance.md).
      # pytest-xdist is not used.
      - name: Runner CPUs and test parallelism
        shell: bash
        run: |
          uv run python -c "import importlib.util, os; print('os.cpu_count():', os.cpu_count()); print('pytest-xdist installed:', importlib.util.find_spec('xdist') is not None)"
          echo "REFUTE_WORKERS=$(uv run python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_ENV"
      # Tests run with --disable-socket (pytest-socket, see pyproject.toml):
      # any attempt to use the network fails the test suite.
      # The shard arguments are computed first, so that a failure of ci_shard.py fails
      # the step (GitHub's bash runs with -e) instead of leaving pytest without them.
      - name: Tests (no network)
        shell: bash
        run: |
          args="$(uv run python scripts/ci_shard.py ${{ matrix.shard }})"
          uv run pytest --durations=25 $args
