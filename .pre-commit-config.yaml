# calibration/*/audit/ and docs/validation/v0.2.1/pre-document-runs/ hold preserved
# records whose bytes are cited by SHA-256: no hook may lint, reformat or change them
# (see CLAUDE.md).
exclude: ^(calibration/[^/]+/audit/|docs/validation/v0\.2\.1/(pre-document-runs|population)/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9 # keep equal to the ruff version in uv.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
